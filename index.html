<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jagannath Hora AI Kundli - 21 Varga Charts</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gold: #f59e0b;
            --accent-gold: #fbbf24;
            --bg-dark: #070a12;
            --card-bg: rgba(22, 30, 46, 0.90);
            --text-light: #f8fafc;
            --border-gold: rgba(245, 158, 11, 0.35);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: radial-gradient(circle at top, #1e1b4b, var(--bg-dark));
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }
        .btn-settings {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 18px;
            padding: 24px 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .form-group {
            margin-bottom: 16px;
            position: relative;
        }
        label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            font-size: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .time-row {
            display: flex;
            gap: 10px;
        }
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #0f172a;
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            margin-top: 4px;
        }
        .suggestion-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #1e293b;
            font-size: 13px;
            color: #e2e8f0;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }
        .result-box {
            margin-top: 22px;
            padding: 20px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid var(--accent-gold);
            display: none;
        }
        .error-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            display: none;
        }
        .loader {
            border: 3px solid #1e293b;
            border-top: 3px solid var(--accent-gold);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-content {
            background: #0f172a;
            border: 1px solid var(--accent-gold);
            border-radius: 14px;
            width: 100%;
            max-width: 450px;
            padding: 22px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .close-btn {
            color: #94a3b8;
            cursor: pointer;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn-settings" onclick="openKeyModal()"><i class="fa-solid fa-key"></i> API Keys Setup</button>
    </div>

    <div class="header">
        <div class="icon-box" style="width:70px; height:70px; margin:0 auto 12px; background:rgba(245,158,11,0.15); border:2px solid #fbbf24; border-radius:50%; display:flex; align-items:center; justify-content:center;"><i class="fa-solid fa-om" style="font-size:36px; color:#fbbf24;"></i></div>
        <h1 style="font-size:26px; color:#fbbf24;">Jagannath Hora AI Kundli</h1>
        <p style="color:#94a3b8; font-size:13px; margin-top:4px;">► Accurate 21 Varga Charts, Planetary Longitudes & Vedic Predictions</p>
    </div>

    <div class="main-card">
        <div class="form-group">
            <label><i class="fa-solid fa-user"></i> Full Name</label>
            <input type="text" id="name" placeholder="Enter full name">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-calendar-days"></i> Date of Birth</label>
            <input type="date" id="dob">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-clock"></i> Time of Birth</label>
            <div class="time-row">
                <input type="time" id="tob" style="flex:2;">
                <select id="ampm" style="flex:1;">
                    <option value="AM">AM</option>
                    <option value="PM" selected>PM</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-location-dot"></i> Place of Birth (Global Search)</label>
            <input type="text" id="pob" placeholder="Type city or place name..." oninput="searchLocation(this.value)" autocomplete="off">
            <div class="suggestions-list" id="suggestions"></div>
        </div>

        <div id="coordDisplay" style="font-size:11px; color:#94a3b8; margin-bottom:14px; display:none;">
            <i class="fa-solid fa-globe"></i> Coordinates: Lat: <span id="latVal">0</span>, Lon: <span id="lonVal">0</span>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="generateKundli()"><i class="fa-solid fa-star"></i> Calculate 21 Varga Charts & Kundli</button>

        <div class="error-box" id="errorBox"></div>

        <div class="result-box" id="resultBox">
            <h3 style="color: #fbbf24; border-bottom:1px solid rgba(245,158,11,0.2); padding-bottom:8px; margin-bottom:14px;">
                <i class="fa-solid fa-scroll"></i> Jagannath Hora AI Chart Report
            </h3>
            <div id="resultContent" style="line-height:1.7; font-size:14px; color:#cbd5e1;"></div>
        </div>
    </div>

    <div class="modal" id="keyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: #fbbf24; font-size:18px;"><i class="fa-solid fa-key"></i> Configure API Keys</h3>
                <span class="close-btn" onclick="closeKeyModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>Google Gemini API Key</label>
                <input type="password" id="geminiKeyInput" placeholder="Paste AIzaSy... key here">
            </div>
            <p style="font-size:11px; color:#94a3b8; margin-bottom:15px;">Keys are saved locally in your browser storage.</p>
            <button class="btn-submit" onclick="saveKeys()"><i class="fa-solid fa-floppy-disk"></i> Save Keys</button>
        </div>
    </div>

<script>
    let selectedLat = "20.2961";
    let selectedLon = "85.8245";

    window.onload = function() {
        const savedGeminiKey = localStorage.getItem('GEMINI_API_KEY') || "";
        if(savedGeminiKey) {
            document.getElementById('geminiKeyInput').value = savedGeminiKey;
        }
    };

    function openKeyModal() { document.getElementById('keyModal').style.display = 'flex'; }
    function closeKeyModal() { document.getElementById('keyModal').style.display = 'none'; }

    function saveKeys() {
        const key = document.getElementById('geminiKeyInput').value.trim();
        if(key) {
            localStorage.setItem('GEMINI_API_KEY', key);
            alert('Gemini API Key Saved Successfully!');
            closeKeyModal();
        } else {
            alert('Please enter a valid Gemini API key.');
        }
    }

    async function searchLocation(query) {
        const list = document.getElementById('suggestions');
        if (query.length < 3) {
            list.style.display = 'none';
            return;
        }

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await res.json();
            
            list.innerHTML = '';
            if (data.length > 0) {
                list.style.display = 'block';
                data.slice(0, 5).forEach(place => {
                    const item = document.createElement('div');
                    item.className = 'suggestion-item';
                    item.innerText = place.display_name;
                    item.onclick = () => {
                        document.getElementById('pob').value = place.display_name;
                        selectedLat = place.lat;
                        selectedLon = place.lon;
                        document.getElementById('latVal').innerText = selectedLat;
                        document.getElementById('lonVal').innerText = selectedLon;
                        document.getElementById('coordDisplay').style.display = 'block';
                        list.style.display = 'none';
                    };
                    list.appendChild(item);
                });
            }
        } catch (e) { console.error(e); }
    }

    async function generateKundli() {
        const name = document.getElementById('name').value.trim();
        const dob = document.getElementById('dob').value;
        const tob = document.getElementById('tob').value;
        const ampm = document.getElementById('ampm').value;
        const pob = document.getElementById('pob').value.trim();
        const geminiKey = localStorage.getItem('GEMINI_API_KEY') || document.getElementById('geminiKeyInput').value.trim();

        const errorBox = document.getElementById('errorBox');
        const resultBox = document.getElementById('resultBox');
        const resultContent = document.getElementById('resultContent');
        const submitBtn = document.getElementById('submitBtn');

        errorBox.style.display = 'none';
        
        if(!name || !dob || !tob || !pob) {
            alert('Please fill in Name, DOB, Time, and Birth Place!');
            return;
        }

        if(!geminiKey) {
            alert('Gemini API Key missing! Click "API Keys Setup" at the top to configure your key.');
            openKeyModal();
            return;
        }

        submitBtn.disabled = true;
        resultBox.style.display = 'block';
        resultContent.innerHTML = '<span class="loader"></span> <b>Jagannath Hora Planetary Calculations in Progress... Calculating 21 Varga Charts.</b>';

        const promptText = `Act as an expert Vedic Astrologer following traditional Jagannath Hora rules. Calculate and generate detailed analysis for user:
Name: ${name}
Date of Birth: ${dob}
Time of Birth: \({tob}\){ampm}
Place of Birth: \({pob} (Latitude:\){selectedLat}, Longitude: ${selectedLon})

Generate structured HTML output containing:
1. Basic Details: Lagna, Moon Sign (Rashi), Nakshatra, and Nakshatra Lord.
2. Planetary Positions (Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn, Rahu, Ketu with Degree, Rashi, House position).
3. 21 Varga Charts Overview (Key Highlights for D1 Rashi, D9 Navamsha, D10 Dashamsha, D60 Shashtiamsha).
4. Current Mahadasha & Antardasha timeline.
5. In-depth Predictions for Career, Wealth, Health & Relationships.
6. Effective Vedic Remedies (Mantras, Gemstones, Rituals).
Use clean HTML formatting tags like <h4>, <p>, <ul>, <li>, <b> directly in your response text.`;

        try {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`;

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || `API Error Status ${response.status}`);
            }

            let aiHtml = data.candidates[0].content.parts[0].text;
            aiHtml = aiHtml.replace(/```html/g, '').replace(/```/g, '');

            resultContent.innerHTML = `
                <div style="background:rgba(245,158,11,0.1); padding:12px; border-radius:8px; margin-bottom:14px; border:1px solid rgba(245,158,11,0.2);">
                    <p><b>👤 Name:</b> \({name} | <b>📅 DOB:</b>\){dob} (\({tob}\){ampm})</p>
                    <p><b>📍 Place:</b> ${pob}</p>
                </div>
                <div>${aiHtml}</div>
            `;
        } catch (err) {
            resultBox.style.display = 'none';
            errorBox.style.display = 'block';
            errorBox.innerHTML = `⚠️ <b>Calculation Error:</b> ${err.message}. Please verify your Gemini API key in settings.`;
        } finally {
            submitBtn.disabled = false;
        }
    }
</script>
</body>
</html>
