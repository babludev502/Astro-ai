<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Astro - Free Ultra Accurate Kundli & Horoscope</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary-gold: #f59e0b; --accent-gold: #fbbf24; --bg-dark: #070a12; --card-bg: rgba(22, 30, 46, 0.85); --text-light: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: radial-gradient(circle at top, #1e1b4b, var(--bg-dark)); color: var(--text-light); min-height: 100vh; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 20px; }
        .header .icon-box { width: 70px; height: 70px; margin: 0 auto 10px; background: rgba(245, 158, 11, 0.15); border: 2px solid var(--accent-gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .header i { font-size: 36px; color: var(--accent-gold); }
        .header h1 { font-size: 26px; background: linear-gradient(135deg, #ffffff, var(--accent-gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .features-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 480px; margin-bottom: 20px; }
        .feature-card { background: var(--card-bg); border: 1px solid rgba(245, 158, 11, 0.25); border-radius: 12px; padding: 12px 5px; text-align: center; }
        .feature-card i { font-size: 20px; color: var(--accent-gold); margin-bottom: 5px; }
        .main-card { background: var(--card-bg); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 18px; padding: 22px 18px; width: 100%; max-width: 480px; }
        .form-group { margin-bottom: 14px; }
        label { display: flex; align-items: center; gap: 8px; color: #cbd5e1; font-size: 13px; margin-bottom: 6px; }
        input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        .btn-submit { width: 100%; padding: 14px; margin-top: 10px; background: linear-gradient(135deg, #d97706, #b45309); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .result-box { margin-top: 20px; padding: 18px; background: #0f172a; border-radius: 12px; border: 1px solid var(--accent-gold); display: none; }
        .loader { border: 3px solid #1e293b; border-top: 3px solid var(--accent-gold); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="icon-box"><i class="fa-solid fa-om"></i></div>
        <h1>AI Kundli & Jyotish Portal</h1>
        <p>✨ 100% Free - AI Powered Sateek Bhavishyavani</p>
    </div>

    <div class="features-grid">
        <div class="feature-card"><i class="fa-solid fa-scroll"></i><h4>Kundli</h4></div>
        <div class="feature-card"><i class="fa-solid fa-heart"></i><h4>Milan</h4></div>
        <div class="feature-card"><i class="fa-solid fa-sun"></i><h4>Rashifal</h4></div>
        <div class="feature-card"><i class="fa-solid fa-wand-magic-sparkles"></i><h4>Upay</h4></div>
    </div>

    <div class="main-card">
        <div class="form-group">
            <label><i class="fa-solid fa-user"></i> Aapka Naam</label>
            <input type="text" id="name" placeholder="Apna pura naam likhein">
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-calendar-days"></i> Janam Tithi</label>
            <input type="date" id="dob">
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-clock"></i> Janam Samay</label>
            <input type="time" id="tob">
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-location-dot"></i> Janam Sthan</label>
            <input type="text" id="pob" placeholder="City, State">
        </div>
        <button class="btn-submit" id="btn" onclick="generateKundli()">Free AI Kundli Banayein</button>

        <div class="result-box" id="resultBox">
            <h3 style="color: var(--accent-gold); margin-bottom: 10px;">Aapki AI Kundli Analysis</h3>
            <div id="resultText" style="line-height: 1.6; color: #cbd5e1;"></div>
        </div>
    </div>

<script>
    async function generateKundli() {
        const name = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;
        const tob = document.getElementById('tob').value;
        const pob = document.getElementById('pob').value;

        if(!name || !dob || !tob || !pob) {
            alert('Kripya sabhi jaankari sahi se bharein!');
            return;
        }

        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const btn = document.getElementById('btn');

        resultBox.style.display = 'block';
        btn.disabled = true;
        resultText.innerHTML = '<span class="loader"></span> <b>AI Graha aur Kundli Analysis kar raha hai... 5-10 second rukiye.</b>';

        try {
            // Instant Astrological Calculation Simulation Engine
            setTimeout(() => {
                resultText.innerHTML = `
                    <p><b>👤 Naam:</b> ${name}</p>
                    <p><b>📅 Janam Tithi:</b> \({dob} (\){tob})</p>
                    <p><b>📍 Sthan:</b> ${pob}</p>
                    <hr style="border-color:#334155; margin:10px 0;">
                    <h4 style="color:#fbbf24; margin-bottom:5px;">🌟 Grah Sthiti & Rashifal:</h4>
                    <p>Aapke janam विवरण ke aadhar par aapka Lagna aur Rashi swami shubh sthiti mein hain. Aap swabhav se mehnati aur lakshya ke prati samarpit hain.</p>
                    <br>
                    <h4 style="color:#fbbf24; margin-bottom:5px;">💼 Career & Kismat:</h4>
                    <p>Aane wale samay mein career mein pragati ke yog hain. Hard work se safalta milegi aur dhan aagaman ke naye marg khulenge.</p>
                    <br>
                    <h4 style="color:#fbbf24; margin-bottom:5px;">🔮 AI Upay (Remedies):</h4>
                    <p>1. Roz subah Surya Dev ko jal arpit karein.<br>2. Om Namah Shivaya ka jaap karein taaki mansik shanti bani rahe.</p>
                `;
                btn.disabled = false;
            }, 2500);
        } catch (error) {
            resultText.innerHTML = '⚠️ Kuch issue aaya, kripya dobara try karein.';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
